name: Check

on:
    push:
        paths:
            - "src/**"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.json"
            - "tsconfig.build.json"
            - "vite.config.mts"
            - ".eslintrc.cjs"
            - ".github/workflows/check.yml"
    pull_request:
        paths:
            - "src/**"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.json"
            - "tsconfig.build.json"
            - "vite.config.mts"
            - ".eslintrc.cjs"
            - ".github/workflows/check.yml"

jobs:
    check:
        name: Lint, Test & Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npx tsc --noEmit

            - name: Run tests
              run: npm test -- --run
