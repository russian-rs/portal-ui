name: Build & Deploy

on:
  push:
    branches: [ main ]

env:
  PERIOD: 10 # seconds
  ATTEMPTS: 60 # PERIOD * ATTEMPTS = 600 s = 10 min

jobs:
  Build:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: create .npmrc
        run: 'echo -e "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN\n@russian-rs:registry=https://npm.pkg.github.com/" > .secret_npmrc'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ruskadijaspora/portal-ui
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          secret-files: |
            "npmrc=./.secret_npmrc"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  Deploy:
    runs-on: ubuntu-latest
    needs:
      - Build
    steps:
      - name: install jq
        run: sudo apt-get install jq
      - name: start deploy
        id: start_deploy
        run: |
          response=$(curl -s --request GET '${{ vars.COOLIFY_API_URL }}/api/v1/deploy?uuid=${{ vars.COOLIFY_SERVICE_ID }}&force=false' --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}')
          deployment_uuid=$(echo $response | jq -r '.deployments[0].deployment_uuid')
          if [[ $deployment_uuid == "null" ]]; then
            printf "Failed to start deployment: \n$response"
            exit 1
          fi
          echo "deployment_uuid=$deployment_uuid" >> $GITHUB_OUTPUT
      - name: checking status
        run: |
          deployment_uuid=${{ steps.start_deploy.outputs.deployment_uuid }}
          deployment_url=""
          
          period=${{ env.PERIOD }}
          attempts=${{ env.ATTEMPTS }}
          
          count=0
          while [ "$status" != "finished" ] && [ "$count" -lt "$attempts" ]
          do
            sleep $period
            count=$(( $count + 1 ))
            response=$(curl -s --request GET "${{ vars.COOLIFY_API_URL }}/api/v1/deployments/$deployment_uuid" --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}')
            status=$(echo $response | jq -r '.status')
            deployment_url=$(echo $response | jq -r '.deployment_url')
          
            printf `expr $count \* $period`
            printf "s, status: $status\n"
          
            if [[ $status == "null" ]]; then
              printf "Deployment failed: \n$response"
              exit 1
            fi
          
            if [[ $status == "finished" ]]; then
              printf "Deployment finished successfully. \nMore info at ${{ vars.COOLIFY_API_URL }}$deployment_url"
              exit 0
            fi
          
            if [[ $status != "in_progress" ]]; then
              printf "Deployment failed. \nMore info at ${{ vars.COOLIFY_API_URL }}$deployment_url"
              exit 1
            fi
          done
          
          printf "Deployment didn't completed after 10 minutes. \nMore info at ${{ vars.COOLIFY_API_URL }}$deployment_url"
          exit 1
