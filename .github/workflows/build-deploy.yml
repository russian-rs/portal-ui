name: Check, Build & Deploy

on:
    push:
        branches: [main]

env:
    PERIOD: 10 # seconds
    ATTEMPTS: 60 # PERIOD * ATTEMPTS = 600 s = 10 min

jobs:
    Check:
        name: Lint, Test & Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              env:
                  GITHUB_RUSSIAN_RS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  npm ci || (echo "npm ci failed, trying npm install..." && npm install --package-lock-only && npm ci)

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npx tsc --noEmit

            - name: Run tests
              run: npm test -- --run

    Build:
        permissions:
            contents: read
            packages: read
        runs-on: ubuntu-latest
        needs:
            - Check
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ruskadijaspora/docker:portal-ui
                  build-args: NPM_TOKEN=${{ secrets.NPM_TOKEN }}

    Deploy:
        runs-on: ubuntu-latest
        needs:
            - Build
        steps:
            - name: install jq
              run: sudo apt-get install jq
            - name: start deploy
              id: start_deploy
              run: |
                  response=$(curl -s --request GET '${{ vars.COOLIFY_API_URL }}/api/v1/deploy?uuid=${{ vars.COOLIFY_SERVICE_ID }}&force=false' --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}')
                  deployment_uuid=$(echo $response | jq -r '.deployments[0].deployment_uuid')
                  if [[ $deployment_uuid == "null" ]]; then
                    printf "Failed to start deployment: \n$response"
                    exit 1
                  fi
                  echo "deployment_uuid=$deployment_uuid" >> $GITHUB_OUTPUT
